name: Deploy to Nindohost

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Configure Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ℹ️ Infos Node & npm
      - name: Node info
        run: |
          node -v
          npm -v

      # ✅ Vérifie que les secrets indispensables existent
      - name: Preflight secrets
        run: |
          set -e
          if [ -z "${{ secrets.FTP_HOST }}" ]; then
            echo "❌ Missing FTP_HOST"
            exit 1
          fi
          if [ -z "${{ secrets.FTP_USERNAME }}" ]; then
            echo "❌ Missing FTP_USERNAME"
            exit 1
          fi
          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "❌ Missing FTP_PASSWORD"
            exit 1
          fi
          echo "✅ Secrets présents"

      # ✅ Install deps (npm install, pas de npm ci pour éviter EBADPLATFORM)
      - name: Install deps
        run: npm install

      # 🏗 Build du projet
      - name: Build
        run: npm run build

      # 🔎 Archive dist en artifact (debug)
      - name: Upload dist artifact (debug)
      # on garde ça pour pouvoir inspecter le build si besoin
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      # 🚀 Déploiement FTP vers Nindohost
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          # ✅ On déploie uniquement le build Vite
          local-dir: dist/
          # ✅ Dossier distant (à adapter si besoin)
          server-dir: ${{ secrets.FTP_DIR || '/public_html/' }}
          dangerous-clean-slate: false
