name: Deploy to Nindohost

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    # 🌍 Variables d'environnement globales au job (optionnel)
    env:
      # Exemple pour Vite :
        VITE_API_BASE: ${{ secrets.VITE_API_BASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Configure la version de Node AVANT d'afficher les infos
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ℹ️ Affiche les versions de Node & npm (debug)
      - name: Node info
        run: |
          node -v
          npm -v

      # ✅ Vérifie que les secrets indispensables existent
      - name: Preflight secrets
        run: |
          set -e
          [ -n "${{ secrets.FTP_HOST }}" ] || (echo "❌ Missing FTP_HOST" && exit 1)
          [ -n "${{ secrets.FTP_USERNAME }}" ] || (echo "❌ Missing FTP_USERNAME" && exit 1)
          [ -n "${{ secrets.FTP_PASSWORD }}" ] || (echo "❌ Missing FTP_PASSWORD" && exit 1)
          echo "✅ Secrets présents"

      # ✅ Installe sans dépendances optionnelles (évite fsevents, chokidar, etc. sur Linux)
      - name: Install deps (omit optional)
        run: |
          if [ -f package-lock.json ]; then
            npm ci --omit=optional
          else
            npm install --omit=optional
          fi

      # 🏗 Build du projet
      - name: Build
        run: npm run build

      # 🔎 Archive dist en artifact (pratique pour debug)
      - name: Upload dist artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      # 🚀 Déploiement FTP vers Nindohost
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: dist/
          server-dir: ${{ secrets.FTP_DIR || '/public_html/' }}
          dangerous-clean-slate: false
